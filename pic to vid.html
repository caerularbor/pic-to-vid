<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>pic to vid</title>
<style>
  :root {
    --bg: #0d0f12;
    --surface: rgba(22, 25, 30, 0.72);
    --accent: #6b8cff;
    --accent-2: #a8b8e0;
    --text: #dbe2ea;
    --muted: #8a94a3;
    --border: rgba(120, 140, 170, 0.25);
    --danger: #e08a9a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }

  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: radial-gradient(1100px 700px at 20% 0%, #151b26 0%, transparent 55%),
                radial-gradient(900px 600px at 90% 100%, #12161d 0%, transparent 55%),
                var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 44px 24px 170px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .title {
    text-align: center;
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--accent-2);
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1.6fr;
    gap: 24px;
    align-items: start;
  }

  .panel {
    background: var(--surface);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel-label {
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .dropzone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 24px 16px;
    cursor: pointer;
    text-align: center;
    transition: border-color 0.25s ease, background 0.25s ease;
    background: rgba(13, 15, 18, 0.5);
  }

  .dropzone:hover, .dropzone.dragover {
    border-color: var(--accent);
    background: rgba(107, 140, 255, 0.08);
  }

  .dropzone .icon { font-size: 1.8rem; line-height: 1; }
  .dropzone p { font-size: 0.98rem; color: var(--text); }
  .dropzone .hint { color: var(--muted); font-size: 0.8rem; }

  input[type="file"] { display: none; }

  .slider-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 4px 2px;
  }

  .slider-row label {
    display: flex;
    justify-content: space-between;
    font-size: 0.92rem;
    color: var(--text);
  }

  .slider-row label b { color: var(--accent); }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  .btn {
    border-radius: 999px;
    padding: 12px 26px;
    cursor: pointer;
    font-size: 0.95rem;
    letter-spacing: 0.5px;
    border: none;
    transition: background 0.25s ease, transform 0.15s ease, opacity 0.25s ease;
  }

  .btn-primary {
    color: #0b0e14;
    font-weight: 700;
    background: var(--accent-2);
  }

  .btn-primary:hover { background: #c2cff0; transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btn-secondary {
    color: var(--text);
    background: rgba(120, 140, 170, 0.15);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover { background: rgba(120, 140, 170, 0.3); }

  .picture-preview {
    width: 100%;
    max-height: 280px;
    object-fit: contain;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(13, 15, 18, 0.5);
  }

  .product-placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    min-height: 260px;
    text-align: center;
  }

  #resultVideo {
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    margin: auto;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #000;
  }

  .progress {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    width: min(560px, calc(100% - 96px));
    z-index: 3;
    text-align: left;
    background: var(--surface);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
  }

  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 10px;
  }

  .progress-stage { color: var(--accent-2); font-size: 0.92rem; }
  .progress-stage.error { color: var(--danger); }
  .progress-count { font-size: 1.3rem; font-weight: 700; color: var(--accent-2); white-space: nowrap; }

  .bar {
    height: 12px;
    border-radius: 999px;
    background: rgba(13, 15, 18, 0.8);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #5a7bd6, var(--accent), #a8b8e0);
    transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .progress .hint {
    margin-top: 10px;
    text-align: center;
    color: var(--muted);
    font-size: 0.82rem;
  }

  .github {
    position: fixed;
    left: 20px;
    bottom: 20px;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    color: var(--accent);
    border: 1px solid var(--border);
    background: rgba(22, 25, 30, 0.7);
    transition: color 0.25s ease, transform 0.15s ease;
  }

  .github:hover { color: #ffffff; transform: translateY(-2px); }

  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="page">
    <h1 class="title">pic to vid</h1>

    <div class="layout">
      <!-- source: picture -->
      <section class="panel">
        <span class="panel-label">picture</span>
        <label class="dropzone" id="dropzone" for="fileInput">
          <div class="icon">🖼️</div>
          <p>Drop your picture here</p>
          <p class="hint">or click to browse — JPG, PNG, GIF, WebP</p>
          <input type="file" id="fileInput" accept="image/*" />
        </label>

        <div id="picturePreviewWrap" style="display:flex;flex-direction:column;gap:10px;" hidden>
          <img id="picturePreview" class="picture-preview" alt="uploaded picture" />
          <button class="btn btn-secondary" id="changePictureBtn" type="button">Change picture</button>
        </div>

        <div class="slider-row">
          <label>block size <b id="blockSizeVal">8</b></label>
          <input type="range" id="blockSize" min="1" max="32" value="8" />
        </div>

        <button class="btn btn-primary" id="convertBtn" type="button">Convert</button>
      </section>

      <!-- product: video to make + result -->
      <section class="panel">
        <span class="panel-label">video</span>
        <label class="dropzone" id="videoDropzone" for="videoInput">
          <div class="icon">🎬</div>
          <p>Drop your video here</p>
          <p class="hint">or click to browse — MP4, WebM, etc.</p>
          <input type="file" id="videoInput" accept="video/*" />
        </label>
        <div id="videoMeta" class="hint" style="color: var(--muted); font-size: 0.82rem;" hidden></div>

        <span class="panel-label">result</span>
        <div class="product-placeholder" id="productPlaceholder">ovo</div>
        <video id="resultVideo" controls loop muted playsinline autoplay preload="metadata" hidden></video>
      </section>
    </div>
  </div>

  <section class="progress" id="progress" hidden>
    <div class="progress-top">
      <span class="progress-stage" id="progressStage">Processing…</span>
      <span class="progress-count" id="progressCount">0.0%</span>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <p class="hint" id="progressRemaining"></p>
  </section>

  <a class="github" href="https://github.com/caerularbor" target="_blank" rel="noopener"
     title="GitHub" aria-label="GitHub">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="currentColor">
      <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
    </svg>
  </a>

  <script>
    const videoInput = document.getElementById('videoInput');
    const videoDropzone = document.getElementById('videoDropzone');
    const videoMeta = document.getElementById('videoMeta');
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const blockSize = document.getElementById('blockSize');
    const blockSizeVal = document.getElementById('blockSizeVal');
    const convertBtn = document.getElementById('convertBtn');
    const productPlaceholder = document.getElementById('productPlaceholder');
    const resultVideo = document.getElementById('resultVideo');
    const progress = document.getElementById('progress');
    const progressStage = document.getElementById('progressStage');
    const progressCount = document.getElementById('progressCount');
    const progressRemaining = document.getElementById('progressRemaining');
    const barFill = document.getElementById('barFill');
    const picturePreviewWrap = document.getElementById('picturePreviewWrap');
    const picturePreview = document.getElementById('picturePreview');
    const changePictureBtn = document.getElementById('changePictureBtn');

    let selectedFile = null;
    let pollTimer = null;
    let pictureUrl = null;

    blockSize.addEventListener('input', () => {
      blockSizeVal.textContent = blockSize.value;
    });

    function updateProgressUI(p) {
      progress.hidden = false;
      progressStage.textContent = p.message || p.stage;
      progressStage.classList.toggle('error', p.stage === 'error');
      progressCount.textContent = (p.percent || 0).toFixed(1) + '%';
      barFill.style.width = (p.percent || 0) + '%';

      if (p.stage === 'error') {
        progressRemaining.textContent = 'Something went wrong — check the server console.';
      } else if (p.stage === 'encoding') {
        progressRemaining.textContent = 'Finishing up…';
      } else if (p.stage === 'done') {
        progressRemaining.textContent = 'Complete';
      } else if (p.stage === 'idle') {
        progressRemaining.textContent = 'Ready';
      } else {
        progressRemaining.textContent =
          (p.done || 0).toLocaleString() + ' / ' + (p.total || 0).toLocaleString() +
          ' — ' + (p.remaining || 0).toLocaleString() + ' frames left';
      }
    }

    function showResult() {
      fetch('result.mp4?v=' + Date.now())
        .then((r) => r.blob())
        .then((blob) => {
          const url = URL.createObjectURL(blob);
          resultVideo.src = url;
          resultVideo.load();
          productPlaceholder.hidden = true;
          resultVideo.hidden = false;
          resultVideo.play().catch(() => {});
        })
        .catch((err) => console.error('video load failed:', err));
    }

    function pollProgress() {
      fetch('/api/progress?t=' + Date.now())
        .then((r) => r.json())
        .then((p) => {
          updateProgressUI(p);
          if (p.finished) {
            clearInterval(pollTimer);
            convertBtn.disabled = false;
            showResult();
          } else if (p.error) {
            clearInterval(pollTimer);
            convertBtn.disabled = false;
          } else if (!p.running) {
            // idle (e.g. video extraction finished)
            clearInterval(pollTimer);
            convertBtn.disabled = false;
          }
        })
        .catch(() => {});
    }

    function startPolling() {
      clearInterval(pollTimer);
      pollTimer = setInterval(pollProgress, 150);
    }

    // ---- video upload ----
    function handleVideo(file) {
      if (!file) return;
      videoMeta.hidden = false;
      videoMeta.textContent = 'video: ' + file.name + ' (' + (file.size / 1e6).toFixed(1) + ' MB)';
      convertBtn.disabled = true;
      updateProgressUI({ stage: 'extracting', message: 'Uploading video…', done: 0, total: 1, remaining: 1, percent: 0 });
      fetch('/api/video', { method: 'POST', body: file })
        .then(() => { startPolling(); })
        .catch((err) => {
          console.error('video upload failed:', err);
          convertBtn.disabled = false;
          updateProgressUI({ stage: 'error', message: 'Cannot reach the server', done: 0, total: 0, percent: 0 });
        });
    }

    videoInput.addEventListener('change', () => handleVideo(videoInput.files[0]));
    ['dragenter', 'dragover'].forEach((evt) => videoDropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      videoDropzone.classList.add('dragover');
    }));
    ['dragleave', 'drop'].forEach((evt) => videoDropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      videoDropzone.classList.remove('dragover');
    }));
    videoDropzone.addEventListener('drop', (e) => {
      const f = e.dataTransfer.files[0];
      if (f) { videoInput.files = e.dataTransfer.files; handleVideo(f); }
    });

    // ---- picture upload ----
    function handlePicture(file) {
      if (!file) return;
      if (!['image/jpeg', 'image/png', 'image/gif', 'image/webp'].includes(file.type)) {
        alert('Please choose an image file (JPG, PNG, GIF, or WebP).');
        return;
      }
      selectedFile = file;

      // Show the uploaded picture as a preview on the left.
      if (pictureUrl) URL.revokeObjectURL(pictureUrl);
      pictureUrl = URL.createObjectURL(file);
      picturePreview.src = pictureUrl;
      dropzone.hidden = true;
      picturePreviewWrap.hidden = false;
    }

    changePictureBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', () => handlePicture(fileInput.files[0]));
    ['dragenter', 'dragover'].forEach((evt) => dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    }));
    ['dragleave', 'drop'].forEach((evt) => dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
    }));
    dropzone.addEventListener('drop', (e) => {
      const f = e.dataTransfer.files[0];
      if (f) { fileInput.files = e.dataTransfer.files; handlePicture(f); }
    });

    // ---- convert ----
    convertBtn.addEventListener('click', async () => {
      if (!selectedFile) {
        alert('Please choose a picture first.');
        return;
      }
      convertBtn.disabled = true;
      productPlaceholder.hidden = false;
      resultVideo.hidden = true;
      updateProgressUI({ stage: 'rebuilding', message: 'Starting…', done: 0, total: 1, remaining: 1, percent: 0 });

      try {
        await fetch('/api/convert?block_size=' + blockSize.value, {
          method: 'POST',
          body: selectedFile,
        });
        startPolling();
      } catch (err) {
        console.error('convert failed:', err);
        convertBtn.disabled = false;
        updateProgressUI({ stage: 'error', message: 'Cannot reach the server', done: 0, total: 0, percent: 0 });
      }
    });

    // On load, show the progress bar if the server is still extracting.
    (function pollStartup() {
      fetch('/api/progress?t=' + Date.now())
        .then((r) => r.json())
        .then((p) => {
          if (p.running) {
            updateProgressUI(p);
            setTimeout(pollStartup, 200);
          } else {
            progress.hidden = true;
          }
        })
        .catch(() => {});
    })();
  </script>
</body>
</html>
