<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BAD APPLE!! — Converter</title>
<style>
  :root {
    --bg: #08090b;
    --surface: rgba(16, 18, 22, 0.6);
    --accent: #707f84;
    --accent-2: #9aa6ad;
    --text: #d6dde1;
    --muted: #7a858c;
    --border: rgba(112, 127, 132, 0.35);
    --danger: #d98c9a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  [hidden] { display: none !important; }

  html, body { height: 100%; }

  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background-color: var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Random Bad Apple frame as a soft, visible background */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-color: #141a24;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    filter: blur(2px) brightness(0.95);
    transform: scale(1.03);
  }

  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(8, 9, 11, 0.10), rgba(8, 9, 11, 0.45));
  }

  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1160px;
    margin: 0 auto;
    padding: 48px 24px 170px;
    display: flex;
    flex-direction: column;
    gap: 30px;
  }

  .title {
    text-align: center;
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    font-weight: 800;
    letter-spacing: 3px;
    color: var(--accent-2);
    text-shadow: 0 0 30px rgba(112, 127, 132, 0.4);
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 2.5fr;
    gap: 24px;
    align-items: start;
  }

  .panel {
    background: var(--surface);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    min-height: 320px;
  }

  .panel-label {
    font-size: 0.78rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  /* ---- source (upload) panel ---- */
  #sourcePanel {
    aspect-ratio: 1 / 1;
    min-height: 0;
  }

  .dropzone {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 36px 20px;
    cursor: pointer;
    text-align: center;
    transition: border-color 0.3s ease, background 0.3s ease;
    background: rgba(10, 11, 13, 0.4);
  }

  .dropzone:hover,
  .dropzone.dragover {
    border-color: var(--accent);
    background: rgba(112, 127, 132, 0.08);
  }

  .dropzone .icon {
    font-size: 2.4rem;
    line-height: 1;
    color: var(--accent);
    margin-bottom: 10px;
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  .dropzone p { font-size: 1.02rem; color: var(--text); }
  .dropzone .hint { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }

  #fileInput { display: none; }

  .preview { flex: 1; display: flex; flex-direction: column; animation: fadeUp 0.45s ease; }

  .preview img {
    max-width: 100%;
    max-height: 220px;
    border-radius: 10px;
    border: 1px solid var(--border);
    object-fit: contain;
    background: #000;
    margin: 0 auto;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .file-meta {
    margin-top: 14px;
    color: var(--muted);
    font-size: 0.85rem;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .file-meta span {
    background: rgba(112, 127, 132, 0.12);
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: 999px;
  }

  .actions {
    margin-top: 16px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    border-radius: 999px;
    padding: 11px 26px;
    cursor: pointer;
    font-size: 0.92rem;
    letter-spacing: 0.5px;
    transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
  }

  .btn-primary {
    color: #0a0c0e;
    font-weight: 700;
    border: none;
    background: var(--accent-2);
    box-shadow: 0 0 18px rgba(112, 127, 132, 0.35);
  }

  .btn-primary:hover { background: #b6c2c8; transform: translateY(-1px); }

  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .btn-ghost:hover { color: var(--text); border-color: var(--accent); }

  /* ---- product (result) panel ---- */
  #productPanel {
    aspect-ratio: 2.5 / 2;
    min-height: 0;
  }

  .product-placeholder {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
    text-align: center;
    padding: 30px;
  }

  .product-placeholder .icon {
    font-size: 2.6rem;
    color: var(--accent);
    opacity: 0.7;
  }

  #resultVideo {
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    margin: auto;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #000;
    animation: fadeUp 0.5s ease;
  }

  /* ---- progress bar, pinned to the bottom ---- */
  .progress {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    width: min(560px, calc(100% - 96px));
    z-index: 3;
    text-align: left;
    background: var(--surface);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
  }

  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 10px;
  }

  .progress-stage {
    color: var(--accent-2);
    font-size: 0.92rem;
  }

  .progress-stage.error { color: var(--danger); }

  .progress-count {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--accent-2);
    white-space: nowrap;
  }

  .bar {
    height: 12px;
    border-radius: 999px;
    background: rgba(10, 11, 13, 0.7);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #5c6a70, var(--accent), #9aa6ad);
    transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .progress .hint {
    margin-top: 10px;
    text-align: center;
    color: var(--muted);
    font-size: 0.82rem;
  }

  /* ---- GitHub logo, bottom-left ---- */
  .github {
    position: fixed;
    left: 20px;
    bottom: 20px;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    color: var(--accent);
    border: 1px solid var(--border);
    background: rgba(18, 20, 24, 0.7);
    backdrop-filter: blur(6px);
    transition: color 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
  }

  .github:hover {
    color: #ffffff;
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .panel { min-height: 0; }
  }
</style>
</head>
<body>
  <div class="bg" id="bg"></div>

  <div class="page">
    <h1 class="title">BAD APPLE!!</h1>

    <div class="layout">
      <!-- source / upload -->
      <section class="panel" id="sourcePanel">
        <span class="panel-label">source</span>

        <label class="dropzone" id="dropzone" for="fileInput">
          <div class="icon">✦</div>
          <p>Drop your picture file here</p>
          <p class="hint">or click to browse — JPG, PNG, GIF, WebP</p>
          <input type="file" id="fileInput" accept="image/*" />
        </label>

        <section class="preview" id="preview" hidden>
          <img id="previewImage" alt="Uploaded preview" />
          <div class="file-meta" id="fileMeta"></div>
          <div class="actions">
            <button class="btn btn-primary" id="convertBtn" type="button">Convert to Bad Apple</button>
            <button class="btn btn-ghost" id="resetBtn" type="button">Clear</button>
          </div>
        </section>
      </section>

      <!-- product / result -->
      <section class="panel" id="productPanel">
        <span class="panel-label">bad apple</span>

        <div class="product-placeholder" id="productPlaceholder">
          <div class="icon">▶</div>
          <p>ovo</p>
        </div>

        <video id="resultVideo" controls loop muted playsinline autoplay preload="metadata" hidden>
          <source src="result.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      </section>
    </div>
  </div>

  <section class="progress" id="progress" hidden>
    <div class="progress-top">
      <span class="progress-stage" id="progressStage">Processing…</span>
      <span class="progress-count" id="progressCount">0%</span>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <p class="hint" id="progressRemaining"></p>
  </section>

  <a class="github" href="https://github.com/caerularbor" target="_blank" rel="noopener"
     title="GitHub" aria-label="GitHub">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="currentColor">
      <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
    </svg>
  </a>

  <script>
    // If opened as a local file, no server is reachable — warn clearly.
    if (location.protocol === 'file:') {
      alert('Run "python server.py", then open http://127.0.0.1:8000 — not by double-clicking this file.');
    }

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const previewImage = document.getElementById('previewImage');
    const fileMeta = document.getElementById('fileMeta');
    const convertBtn = document.getElementById('convertBtn');
    const resetBtn = document.getElementById('resetBtn');
    const productPlaceholder = document.getElementById('productPlaceholder');
    const resultVideo = document.getElementById('resultVideo');
    const progress = document.getElementById('progress');
    const progressStage = document.getElementById('progressStage');
    const progressCount = document.getElementById('progressCount');
    const progressRemaining = document.getElementById('progressRemaining');
    const barFill = document.getElementById('barFill');
    const bg = document.getElementById('bg');

    const ACCEPTED = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];

    let selectedFile = null;
    let pollTimer = null;

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    // Random Bad Apple frame as the page background (cache-busted so every
    // reload picks a fresh frame).
    fetch('/api/random-frame?t=' + Date.now())
      .then((r) => r.json())
      .then((d) => { if (d.url) bg.style.backgroundImage = 'url("' + d.url + '?t=' + Date.now() + '")'; })
      .catch(() => {
        // Server unreachable (e.g. page opened as file://) — show a visible fallback.
        bg.style.backgroundImage = 'radial-gradient(1200px 800px at 50% 30%, #2a3550, #0a0c12)';
      });

    function handleFile(file) {
      if (!file) return;
      console.log('handleFile:', file.name, file.type, file.size);
      if (!ACCEPTED.includes(file.type)) {
        alert('Please choose an image file (JPG, PNG, GIF, or WebP).');
        return;
      }
      selectedFile = file;
      const reader = new FileReader();
      reader.onload = (e) => {
        previewImage.src = e.target.result;
        dropzone.hidden = true;
        preview.hidden = false;
        progress.hidden = true;
        fileMeta.innerHTML =
          '<span>' + file.name + '</span>' +
          '<span>' + formatBytes(file.size) + '</span>' +
          '<span>' + (file.type || 'unknown').split('/').pop().toUpperCase() + '</span>';
      };
      reader.readAsDataURL(file);
    }

    function resetAll() {
      clearInterval(pollTimer);
      selectedFile = null;
      fileInput.value = '';
      previewImage.src = '';
      fileMeta.innerHTML = '';
      preview.hidden = true;
      progress.hidden = true;
      resultVideo.hidden = true;
      productPlaceholder.hidden = false;
      dropzone.hidden = false;
      convertBtn.disabled = false;
    }

    fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));

    ['dragenter', 'dragover'].forEach((evt) => {
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
      });
    });
    ['dragleave', 'drop'].forEach((evt) => {
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
      });
    });
    dropzone.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files[0];
      if (file) {
        fileInput.files = e.dataTransfer.files;
        handleFile(file);
      }
    });

    resetBtn.addEventListener('click', resetAll);

    function updateProgressUI(p) {
      progress.hidden = false;
      progressStage.textContent = p.message || p.stage;
      progressStage.classList.toggle('error', p.stage === 'error');
      progressCount.textContent = (p.percent || 0).toFixed(1) + '%';
      barFill.style.width = (p.percent || 0) + '%';

      if (p.stage === 'error') {
        progressRemaining.textContent = 'Something went wrong — check the server console.';
      } else if (p.stage === 'encoding') {
        progressRemaining.textContent = 'Finishing up…';
      } else if (p.stage === 'done') {
        progressRemaining.textContent = 'Complete';
      } else {
        progressRemaining.textContent =
          (p.done || 0).toLocaleString() + ' / ' + (p.total || 0).toLocaleString() +
          ' — ' + (p.remaining || 0).toLocaleString() + ' frames left';
      }
    }

    function showResult() {
      // Load the whole video into memory first, then play it from an object
      // URL. This removes streaming/buffering as a variable, so playback speed
      // is consistent regardless of scene complexity.
      fetch('result.mp4?v=' + Date.now())
        .then((r) => r.blob())
        .then((blob) => {
          const url = URL.createObjectURL(blob);
          resultVideo.src = url;
          resultVideo.load();
          productPlaceholder.hidden = true;
          resultVideo.hidden = false;
          resultVideo.play().catch(() => {});
        })
        .catch((err) => console.error('video load failed:', err));
    }

    function pollProgress() {
      fetch('/api/progress?t=' + Date.now())
        .then((r) => r.json())
        .then((p) => {
          updateProgressUI(p);
          if (p.finished) {
            clearInterval(pollTimer);
            convertBtn.disabled = false;
            showResult();
          } else if (p.error) {
            clearInterval(pollTimer);
            convertBtn.disabled = false;
          }
        })
        .catch((err) => console.error('progress poll failed:', err));
    }

    convertBtn.addEventListener('click', async () => {
      console.log('convert clicked, selectedFile =', selectedFile && selectedFile.name);
      if (!selectedFile) return;
      convertBtn.disabled = true;
      updateProgressUI({ stage: 'extracting', message: 'Starting…', done: 0, total: 1, remaining: 1, percent: 0 });

      try {
        await fetch('/api/convert', {
          method: 'POST',
          body: selectedFile,
        });
        console.log('convert POST resolved');
      } catch (err) {
        console.error('convert fetch failed:', err);
        clearInterval(pollTimer);
        convertBtn.disabled = false;
        updateProgressUI({ stage: 'error', message: 'Cannot reach the server', done: 0, total: 0, percent: 0 });
        progressRemaining.textContent = 'Start it with: python server.py';
        return;
      }

      pollTimer = setInterval(pollProgress, 150);
    });

    // On first load, show a loading bar while the server prepares the frames.
    function pollStartup() {
      fetch('/api/progress?t=' + Date.now())
        .then((r) => r.json())
        .then((p) => {
          if (p.running && (p.stage === 'extracting' || p.stage === 'rebuilding' || p.stage === 'encoding')) {
            dropzone.hidden = true;
            updateProgressUI(p);
            setTimeout(pollStartup, 200);
          } else {
            progress.hidden = true;
            if (!selectedFile) {
              dropzone.hidden = false;
            }
          }
        })
        .catch(() => {});
    }

    pollStartup();
  </script>
</body>
</html>
